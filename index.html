<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="OpenStreetMap 데이터를 이용해 두 장소의 실제 도로 이동 거리를 확인하세요."
    />
    <meta name="theme-color" content="#f5f2ea" />
    <title>사이 — 장소 사이 거리 측정</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="사이 홈">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" role="img">
              <path d="M7.5 8.5 16 4l8.5 4.5v15L16 28l-8.5-4.5v-15Z" />
              <circle cx="11" cy="12" r="2.1" />
              <circle cx="21" cy="20" r="2.1" />
              <path d="m12.8 13.4 6.4 5.2" />
            </svg>
          </span>
          <span>사이</span>
        </a>
        <span class="data-credit">OpenStreetMap 기반</span>
      </header>

      <main>
        <section class="hero" aria-labelledby="hero-title">
          <div class="eyebrow"><span></span> 거리 측정</div>
          <h1 id="hero-title">두 장소 사이,<br /><em>얼마나 멀까요?</em></h1>
          <p class="hero-copy">
            출발지와 도착지를 입력하면 실제 도로를 따라 이동하는 거리를 알려드려요.
          </p>
        </section>

        <section class="search-card" aria-label="거리 검색">
          <form id="distance-form" novalidate>
            <div class="route-fields">
              <div class="route-line" aria-hidden="true">
                <span class="line-dot start-dot"></span>
                <span class="line-stroke"></span>
                <span class="line-dot end-dot"></span>
              </div>

              <div class="field-stack">
                <div class="field-group">
                  <label for="origin">출발지</label>
                  <div class="input-wrap">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <circle cx="12" cy="12" r="7" />
                      <circle cx="12" cy="12" r="2.2" />
                    </svg>
                    <input
                      id="origin"
                      name="origin"
                      type="search"
                      placeholder="예: 서울역"
                      autocomplete="street-address"
                      maxlength="160"
                      required
                    />
                  </div>
                </div>

                <button class="swap-button" id="swap-button" type="button" aria-label="출발지와 도착지 바꾸기" title="출발지와 도착지 바꾸기">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m8 7 3-3m-3 3 3 3M8 7h9M16 17l-3 3m3-3-3-3m3 3H7" />
                  </svg>
                </button>

                <div class="field-group">
                  <label for="destination">도착지</label>
                  <div class="input-wrap">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z" />
                      <circle cx="12" cy="10" r="2.3" />
                    </svg>
                    <input
                      id="destination"
                      name="destination"
                      type="search"
                      placeholder="예: 부산역"
                      autocomplete="street-address"
                      maxlength="160"
                      required
                    />
                  </div>
                </div>
              </div>
            </div>

            <p class="form-message" id="form-message" role="alert" aria-live="polite"></p>

            <button class="calculate-button" id="calculate-button" type="submit">
              <span class="button-label">거리 계산하기</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14m-5-5 5 5-5 5" />
              </svg>
              <span class="spinner" aria-hidden="true"></span>
            </button>
          </form>

          <section class="result" id="result" aria-labelledby="result-title" hidden>
            <div class="result-rule"></div>
            <p class="result-kicker" id="result-title">총 이동 거리</p>
            <div class="distance-value"><strong id="distance-value">—</strong><span id="distance-unit">km</span></div>
            <p class="route-summary" id="route-summary"></p>

            <div class="confirmed-places">
              <div>
                <span class="place-dot start-dot"></span>
                <p><small>출발</small><strong id="origin-name"></strong></p>
              </div>
              <div>
                <span class="place-dot end-dot"></span>
                <p><small>도착</small><strong id="destination-name"></strong></p>
              </div>
            </div>

            <a class="map-link" id="map-link" href="#" target="_blank" rel="noopener noreferrer">
              <span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m3 6 5-3 8 3 5-3v15l-5 3-8-3-5 3V6Z" />
                  <path d="M8 3v15m8-12v15" />
                </svg>
                지도에서 보기
              </span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 16 16 8m-6 0h6v6" />
              </svg>
            </a>
          </section>
        </section>

        <p class="usage-note">
          검색 결과와 경로는 OpenStreetMap 데이터를 사용하며, 실제 이동 거리와 다를 수 있습니다.
        </p>
      </main>

      <div class="map-decoration" aria-hidden="true">
        <svg viewBox="0 0 640 350" preserveAspectRatio="xMidYMid meet">
          <path class="contour c1" d="M40 288c74-44 88-126 174-125 70 1 83 55 154 45 75-10 92-94 204-116" />
          <path class="contour c2" d="M-8 241c79-31 122-119 215-100 73 15 93 83 179 61 70-18 101-93 250-118" />
          <path class="contour c3" d="M6 324c112-41 123-113 217-114 94-1 113 64 198 32 76-29 96-100 222-118" />
          <path class="route-path" d="M76 276c49-17 31-93 92-97 67-5 59 99 128 89 74-10 50-139 127-144 73-4 63 88 133 77" />
          <g class="pin pin-start" transform="translate(74 269)">
            <circle r="8" />
            <circle r="16" />
          </g>
          <g class="pin pin-end" transform="translate(557 198)">
            <path d="M0 15s-14-15-14-25a14 14 0 1 1 28 0C14 0 0 15 0 15Z" />
            <circle cy="-10" r="4" />
          </g>
        </svg>
      </div>

      <footer>
        <span>© 2026 사이</span>
        <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap contributors</a>
      </footer>
    </div>
  </body>
</html>
